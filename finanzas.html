<script>
(() => {
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const fmt = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });
const money = n => fmt.format(Math.round(n || 0)).replace(/ /g, " ");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const monthKey = s => s.slice(0, 7);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const monthName = k => { const [y, m] = k.split("-").map(Number); return `${MESES[m - 1]} ${y}`; };
const parseMoney = v => { const n = Number(String(v).replace(/[^\d]/g, "")); return isFinite(n) ? n : 0; };
const fmtInput = v => { const n = parseMoney(v); return n ? n.toLocaleString("es-CO") : ""; };
const fechaCorta = s => { const [y, m, d] = s.split("-").map(Number); return `${d} ${MESES[m - 1].slice(0, 3)}`; };

const CATS_GASTO = ["Comida y mercado","Transporte","Estudio","Vivienda y servicios","Celular e internet","Salud","Ropa y cuidado personal","Salidas y gustos","Familia","Suscripciones","Otros"];
const CATS_INGRESO = ["Salario","Pagos y honorarios","Ayuda familiar","Ventas","Intereses","Otros ingresos"];
const TIPOS_CUENTA = { efectivo: "Efectivo", nequi: "Nequi", banco: "Cuenta bancaria", otro: "Otra" };
const TIPOS_DEUDA = { tarjeta: "Tarjeta de crédito", prestamo: "Préstamo / crédito", persona: "Le debo a una persona", estudio: "Crédito educativo", otro: "Otra" };

/* ---------- estado ---------- */
let E = null;              // documento "estado": cuentas, apartados, deudas, fijos, config
const M = {};              // meses: { "2026-10": [movimientos] }
let tab = "resumen";
let viewMonth = isoDate(today()).slice(0, 7);
let mode = "loading";      // db | local | loading

function blankEstado() {
  return {
    v: 1,
    config: { ingresoMensual: 0 },
    cuentas: [
      { id: uid(), nombre: "Efectivo", tipo: "efectivo", inicial: 0 },
      { id: uid(), nombre: "Nequi", tipo: "nequi", inicial: 0 },
      { id: uid(), nombre: "Cuenta de ahorros", tipo: "banco", inicial: 0 }
    ],
    apartados: [], deudas: [], fijos: []
  };
}

/* ---------- cálculos ---------- */
const allMovs = () => Object.values(M).flat();
function saldoCuenta(c) {
  let s = c.inicial || 0; const k = "c:" + c.id;
  for (const m of allMovs()) { if (m.hacia === k) s += m.monto; if (m.desde === k) s -= m.monto; }
  return s;
}
function saldoDeuda(d) {
  let s = d.inicial || 0; const k = "d:" + d.id;
  for (const m of allMovs()) { if (m.desde === k) s += m.monto; if (m.hacia === k) s -= m.monto; }
  return Math.max(0, s);
}
const totalCuentas = () => E.cuentas.reduce((a, c) => a + saldoCuenta(c), 0);
const totalApartado = () => E.apartados.reduce((a, x) => a + (x.monto || 0), 0);
const totalDeuda = () => E.deudas.reduce((a, d) => a + saldoDeuda(d), 0);
const totalCuotas = () => E.deudas.filter(d => saldoDeuda(d) > 0).reduce((a, d) => a + (d.cuota || 0), 0);
const totalFijos = () => E.fijos.reduce((a, f) => a + (f.monto || 0), 0);
function tipoMov(m) { if (!m.desde) return "ingreso"; if (!m.hacia) return "gasto"; if (m.hacia.startsWith("d:")) return "abono"; return "mover"; }
function nombreRef(r) {
  if (!r) return "";
  const [t, id] = r.split(":");
  const x = (t === "c" ? E.cuentas : E.deudas).find(o => o.id === id);
  return x ? x.nombre : "(eliminada)";
}
function mesStats(k) {
  const ms = M[k] || []; let ing = 0, gas = 0; const cats = {};
  for (const m of ms) {
    const t = tipoMov(m);
    if (t === "ingreso") ing += m.monto;
    if (t === "gasto") { gas += m.monto; cats[m.categoria || "Otros"] = (cats[m.categoria || "Otros"] || 0) + m.monto; }
  }
  return { ing, gas, cats };
}
function ingresoReferencia() {
  if (E.config.ingresoMensual) return E.config.ingresoMensual;
  const d = today(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  return mesStats(isoDate(d).slice(0, 7)).ing || mesStats(viewMonthNow()).ing;
}
const viewMonthNow = () => isoDate(today()).slice(0, 7);

/* Próximas fechas de pago: pagos fijos + cuotas de deudas */
function obligaciones() {
  const out = [];
  for (const f of E.fijos) out.push({ key: "f:" + f.id, nombre: f.nombre, monto: f.monto, dia: f.dia, kind: "fijo", obj: f });
  for (const d of E.deudas) if (d.dia && d.cuota && saldoDeuda(d) > 0) out.push({ key: "q:" + d.id, nombre: "Cuota " + d.nombre, monto: d.cuota, dia: d.dia, kind: "cuota", obj: d });
  const t = today(), mk = viewMonthNow(), ms = M[mk] || [];
  for (const o of out) {
    o.pagado = ms.some(m => m.ref === o.key);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    let due = new Date(t.getFullYear(), t.getMonth(), Math.min(o.dia, last));
    if (o.pagado) { const l2 = new Date(t.getFullYear(), t.getMonth() + 2, 0).getDate(); due = new Date(t.getFullYear(), t.getMonth() + 1, Math.min(o.dia, l2)); }
    o.due = due; o.dias = Math.round((due - t) / 86400000);
  }
  return out.sort((a, b) => (a.pagado - b.pagado) || (a.dias - b.dias));
}
function estadoPago(o) {
  if (o.pagado) return `<span class="chip good">Pagado este mes</span>`;
  if (o.dias < 0) return `<span class="chip bad">Vencido hace ${-o.dias} día${o.dias === -1 ? "" : "s"}</span>`;
  if (o.dias === 0) return `<span class="chip bad">Vence hoy</span>`;
  if (o.dias <= 5) return `<span class="chip warn">En ${o.dias} día${o.dias === 1 ? "" : "s"}</span>`;
  return `<span class="chip neutral">En ${o.dias} días</span>`;
}

/* ---------- guardado ---------- */
const writing = new Set(), pendingBody = new Map();
let colRef = null;
function persist(docId) {
  if (mode === "local") { try { localStorage.setItem("finanzas-v1", JSON.stringify({ E, M })); } catch (e) {} setSync("local"); return; }
  if (mode !== "db") return;
  const body = docId === "estado" ? JSON.parse(JSON.stringify(E)) : { items: JSON.parse(JSON.stringify(M[docId.slice(4)] || [])) };
  pendingBody.set(docId, body);
  if (writing.has(docId)) return;
  flush(docId);
}
async function flush(docId) {
  writing.add(docId); setSync("saving");
  while (pendingBody.has(docId)) {
    const body = pendingBody.get(docId); pendingBody.delete(docId);
    let ok = false;
    for (let i = 0; i < 2 && !ok; i++) {
      try { await colRef.doc(docId).set(body); ok = true; }
      catch (e) {
        if (e && e.code === "unavailable" && i === 0) { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); continue; }
        toast(e && e.code === "quota_exceeded" ? "No hay más espacio para guardar. Descarga una copia y avísame." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.");
        break;
      }
    }
  }
  writing.delete(docId);
  if (!writing.size) setSync("ok");
}
const saveEstado = () => persist("estado");
const saveMes = k => persist("mov-" + k);

function setSync(s) {
  const dot = $("#syncDot"), txt = $("#syncTxt");
  dot.className = "dot " + (s === "ok" ? "ok" : s === "local" ? "warn" : "");
  txt.textContent = s === "ok" ? "Guardado en tu cuenta" : s === "saving" ? "Guardando…" : s === "local" ? "Guardado en este celular" : "Cargando tus datos…";
}

async function boot() {
  $("#hoy").textContent = today().toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });
  let db = null, user = null;
  try {
    if (window.claude && window.claude.use) {
      [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    }
  } catch (e) {}
  const id = user ? await user.id() : null;
  if (db && id) {
    mode = "db";
    colRef = db.collection("data/users/" + id);
    let first = true;
    colRef.onSnapshot(snap => {
      for (const d of snap.docs) {
        if (writing.has(d.id) || pendingBody.has(d.id)) continue;
        const data = d.data();
        if (d.id === "estado") { if (!E || JSON.stringify(normalize(data)) !== JSON.stringify(E)) E = normalize(data); }
        else if (d.id.startsWith("mov-")) { const k = d.id.slice(4), items = (data.items || []).map(o => Object.assign({}, o)); if (JSON.stringify(items) !== JSON.stringify(M[k] || [])) M[k] = items; }
      }
      for (const ch of snap.docChanges()) if (ch.type === "removed" && ch.doc.id.startsWith("mov-") && !writing.has(ch.doc.id)) delete M[ch.doc.id.slice(4)];
      if (first || !document.querySelector("dialog[open]")) render();
      first = false;
      if (!writing.size) setSync("ok");
    }, () => { toast("Se perdió la conexión con tus datos. Recarga la página."); });
  } else {
    mode = "local";
    try { const raw = localStorage.getItem("finanzas-v1"); if (raw) { const o = JSON.parse(raw); E = normalize(o.E); Object.assign(M, o.M || {}); } } catch (e) {}
    setSync("local");
    render();
  }
}
function normalize(x) {
  if (!x) return null;
  x = JSON.parse(JSON.stringify(x));
  return { v: 1, config: Object.assign({ ingresoMensual: 0 }, x.config || {}), cuentas: (x.cuentas || []).slice(), apartados: (x.apartados || []).slice(), deudas: (x.deudas || []).slice(), fijos: (x.fijos || []).slice() };
}

    const cta = E.cuentas.find(c => c.id === a.cuentaId);
    return `<div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div class="row"><div><div style="font-weight:600">${esc(a.nombre)}</div><div class="small muted">${cta ? "Está en " + esc(cta.nombre) : "Sin cuenta asignada"}</div></div><span class="num" style="font-size:1.1rem;color:var(--vault)">${money(a.monto)}</span></div>
      ${pct != null ? `<div><div class="bar vault"><i style="width:${pct}%"></i></div><div class="row small muted" style="margin-top:4px"><span>${pct.toFixed(0)}% de la meta</span><span class="num">Meta ${money(a.meta)}</span></div></div>` : ""}
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sm" data-act="edit-apartado" data-id="${a.id}">Editar</button><button class="btn sm" data-act="apartar" data-id="${a.id}" data-s="-1">Sacar</button><button class="btn sm primary" data-act="apartar" data-id="${a.id}" data-s="1">Guardar más</button></div>
    </div>`;
  }).join("");
  const warn = ap > tot ? `<div class="tip" style="background:var(--bad-soft)"><b>Revisa:</b> tienes apartado ${money(ap)} pero en tus cuentas solo hay ${money(tot)}. Puede que hayas gastado plata que estaba guardada.</div>` : "";
  return `
  <div class="sec-head"><h2>Plata que no se toca</h2><button class="btn primary sm" data-act="new-apartado">+ Apartado</button></div>
  <div class="tip">Un <b>apartado</b> es plata que sigue en tu Nequi, en el banco o en efectivo, pero que ya tiene dueño: el semestre, el fondo de emergencia, un viaje, tu futuro. La app la resta de lo que puedes gastar para que no te la gastes sin darte cuenta.</div>
  ${warn}
  ${E.apartados.length ? `<div class="card hero" style="background:var(--vault)"><span class="label">Guardado en total</span><span class="big">${money(ap)}</span><div class="split"><span>Libre para gastar <b class="num">${money(tot - ap)}</b></span></div></div>` : ""}
  ${cards || `<div class="empty">Crea tu primer apartado, por ejemplo "Fondo de emergencia" o "Semestre", y escribe cuánto tienes guardado.</div>`}`;
}

/* ---------- diálogos ---------- */
const dlg = $("#dlg"), form = $("#dlgForm");
let onSubmit = null;
function openDlg(html, submit) {
  form.innerHTML = html; onSubmit = submit;
  form.querySelectorAll("input.money").forEach(i => i.addEventListener("input", () => { const p = i.selectionStart, l = i.value.length; i.value = fmtInput(i.value); const np = p + (i.value.length - l); try { i.setSelectionRange(np, np); } catch (e) {} }));
  dlg.showModal();
  const f = form.querySelector("[autofocus]") || form.querySelector("input,select"); if (f) f.focus();
}
function closeDlg() { dlg.close(); onSubmit = null; render(); }
form.addEventListener("submit", e => {
  e.preventDefault();
  if (e.submitter && e.submitter.value === "cancel") { closeDlg(); return; }
  if (e.submitter && e.submitter.dataset.del) { const d = e.submitter.dataset.del; if (e.submitter.dataset.armed) { onSubmit && onSubmit("delete"); closeDlg(); } else { e.submitter.dataset.armed = "1"; e.submitter.textContent = "Toca otra vez para eliminar"; } return; }
  const fd = Object.fromEntries(new FormData(form));
  const err = onSubmit && onSubmit(fd);
  if (err) { const el = form.querySelector(".err"); if (el) el.textContent = err; return; }
  closeDlg();
});
dlg.addEventListener("cancel", () => { onSubmit = null; setTimeout(render, 0); });

const fld = (label, inner) => `<div class="field"><label>${label}</label>${inner}</div>`;
const inMoney = (name, v, attrs = "") => `<input class="money" name="${name}" id="f-${name}" inputmode="numeric" placeholder="$ 0" value="${v ? Number(v).toLocaleString("es-CO") : ""}" ${attrs}>`;
const inText = (name, v, attrs = "") => `<input name="${name}" id="f-${name}" value="${esc(v || "")}" ${attrs}>`;
const sel = (name, opts, v) => `<select name="${name}" id="f-${name}">${opts.map(([val, lab]) => `<option value="${esc(val)}" ${val === v ? "selected" : ""}>${esc(lab)}</option>`).join("")}</select>`;
const btns = (delLabel) => `<p class="err"></p><div class="dlg-actions">${delLabel ? `<button class="btn danger" data-del="1" value="del">${delLabel}</button><span class="spacer"></span>` : ""}<button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="ok">Guardar</button></div>`;
const cuentaOpts = () => E.cuentas.map(c => ["c:" + c.id, `${c.nombre} (${money(saldoCuenta(c))})`]);
const deudaOpts = () => E.deudas.map(d => ["d:" + d.id, `${d.nombre} (debo ${money(saldoDeuda(d))})`]);
const tarjetaOpts = () => E.deudas.filter(d => d.tipo === "tarjeta").map(d => ["d:" + d.id, `Tarjeta ${d.nombre}`]);

function dlgMov(tipo, existing, preset = {}) {
  const m = existing || { fecha: isoDate(today()), monto: preset.monto || 0, desde: preset.desde || "", hacia: preset.hacia || "", categoria: preset.categoria || "", nota: preset.nota || "", ref: preset.ref || "" };
  tipo = existing ? tipoMov(existing) : tipo;
  const T = { ingreso: "Recibí plata", gasto: "Gasté plata", abono: "Pagué una deuda", mover: "Moví plata entre cuentas" };
  const seg = existing ? "" : `<div class="seg" role="group">${Object.entries({ ingreso: "Recibí", gasto: "Gasté", abono: "Deuda", mover: "Mover" }).map(([k, l]) => `<button type="button" data-seg="${k}" aria-pressed="${k === tipo}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (tipo === "ingreso") body = fld("¿A dónde llegó?", sel("hacia", cuentaOpts(), m.hacia)) + fld("¿De qué?", sel("categoria", CATS_INGRESO.map(c => [c, c]), m.categoria));
  if (tipo === "gasto") body = fld("¿Con qué pagaste?", sel("desde", [...cuentaOpts(), ...tarjetaOpts()], m.desde)) + fld("Categoría", sel("categoria", CATS_GASTO.map(c => [c, c]), m.categoria));
  if (tipo === "abono") body = E.deudas.length ? fld("¿Qué deuda pagaste?", sel("hacia", deudaOpts(), m.hacia)) + fld("¿De qué cuenta salió?", sel("desde", cuentaOpts(), m.desde)) : `<div class="empty">Primero agrega tus deudas en la pestaña Deudas.</div>`;
  if (tipo === "mover") body = `<div class="fields2">${fld("Sale de", sel("desde", cuentaOpts(), m.desde || cuentaOpts()[0]?.[0]))}${fld("Llega a", sel("hacia", cuentaOpts(), m.hacia || cuentaOpts()[1]?.[0]))}</div><p class="small muted" style="margin:0">Por ejemplo: retiro del cajero (banco → efectivo) o recarga de Nequi.</p>`;
  openDlg(`<h2>${existing ? "Editar movimiento" : T[tipo]}</h2>${seg}
    ${fld("Valor", inMoney("monto", m.monto, "required autofocus"))}
    ${body}
    <div class="fields2">${fld("Fecha", `<input type="date" name="fecha" id="f-fecha" value="${m.fecha}" required>`)}${fld("Nota (opcional)", inText("nota", m.nota, 'placeholder="Ej: almuerzo"'))}</div>
    ${btns(existing ? "Eliminar" : "")}`, fd => {
    if (fd === "delete") { const k = monthKey(existing.fecha); M[k] = (M[k] || []).filter(x => x.id !== existing.id); saveMes(k); toast("Movimiento eliminado"); return; }
    const monto = parseMoney(fd.monto);
    if (!monto) return "Escribe el valor.";
    if (tipo === "abono" && !E.deudas.length) return "Primero agrega una deuda.";
    if (tipo === "mover" && fd.desde === fd.hacia) return "Elige dos cuentas distintas.";
    const nm = { id: existing ? existing.id : uid(), t: existing ? existing.t : Date.now(), fecha: fd.fecha, monto, desde: fd.desde || "", hacia: fd.hacia || "", categoria: fd.categoria || "", nota: (fd.nota || "").trim(), ref: m.ref || "" };
    if (tipo === "ingreso") nm.desde = ""; if (tipo === "gasto") nm.hacia = "";
    if (existing) { const ok = monthKey(existing.fecha); M[ok] = (M[ok] || []).filter(x => x.id !== existing.id); if (ok !== monthKey(nm.fecha)) saveMes(ok); }
    const k = monthKey(nm.fecha); (M[k] = M[k] || []).push(nm); saveMes(k);
    toast(existing ? "Movimiento actualizado" : "Movimiento registrado");
  });
  form.querySelectorAll("[data-seg]").forEach(b => b.addEventListener("click", () => {
    const keep = { monto: parseMoney(form.querySelector("[name=monto]").value), nota: form.querySelector("[name=nota]").value };
    dlg.close(); dlgMov(b.dataset.seg, null, keep);
  }));
}

function dlgCuenta(c) {
  const isNew = !c; c = c || { nombre: "", tipo: "banco", inicial: 0 };
  const actual = isNew ? 0 : saldoCuenta(c);
  openDlg(`<h2>${isNew ? "Nueva cuenta" : esc(c.nombre)}</h2>
    ${fld("Nombre", inText("nombre", c.nombre, 'required placeholder="Ej: Bancolombia, Daviplata, alcancía"'))}
    ${fld("Tipo", sel("tipo", Object.entries(TIPOS_CUENTA), c.tipo))}
    ${fld(isNew ? "¿Cuánto tienes hoy?" : "Saldo actual (corrígelo si no coincide con tu app del banco)", inMoney("saldo", actual))}
    ${btns(isNew ? "" : "Eliminar cuenta")}`, fd => {
    if (fd === "delete") { E.cuentas = E.cuentas.filter(x => x.id !== c.id); saveEstado(); toast("Cuenta eliminada"); return; }
    if (!fd.nombre.trim()) return "Ponle un nombre.";
    const nuevo = parseMoney(fd.saldo);
    if (isNew) E.cuentas.push({ id: uid(), nombre: fd.nombre.trim(), tipo: fd.tipo, inicial: nuevo });
    else Object.assign(c, { nombre: fd.nombre.trim(), tipo: fd.tipo, inicial: (c.inicial || 0) + (nuevo - actual) });
    saveEstado(); toast("Cuenta guardada");
  });
}

function dlgDeuda(d) {
  const isNew = !d; d = d || { nombre: "", tipo: "tarjeta", inicial: 0, cupo: 0, cuota: 0, dia: "", tasa: "" };
  const actual = isNew ? 0 : saldoDeuda(d);
  openDlg(`<h2>${isNew ? "Nueva deuda" : esc(d.nombre)}</h2>
    ${fld("Nombre", inText("nombre", d.nombre, 'required placeholder="Ej: Tarjeta Falabella, préstamo tía"'))}
    ${fld("Tipo", sel("tipo", Object.entries(TIPOS_DEUDA), d.tipo))}
    <div class="fields2">${fld("¿Cuánto debes hoy?", inMoney("saldo", actual))}${fld("Cupo total (tarjetas)", inMoney("cupo", d.cupo))}</div>
    <div class="fields2">${fld("Cuota mensual", inMoney("cuota", d.cuota))}${fld("Día de pago", `<input type="number" name="dia" id="f-dia" min="1" max="31" inputmode="numeric" value="${d.dia || ""}" placeholder="1 a 31">`)}</div>
    ${fld("Interés mensual % (opcional, sale en el extracto)", `<input type="number" name="tasa" id="f-tasa" step="0.01" min="0" inputmode="decimal" value="${d.tasa || ""}" placeholder="Ej: 2.1">`)}
    ${btns(isNew ? "" : "Eliminar deuda")}`, fd => {
    if (fd === "delete") { E.deudas = E.deudas.filter(x => x.id !== d.id); saveEstado(); toast("Deuda eliminada"); return; }
    if (!fd.nombre.trim()) return "Ponle un nombre.";
    const dia = fd.dia ? Math.min(31, Math.max(1, parseInt(fd.dia, 10))) : 0;
    const vals = { nombre: fd.nombre.trim(), tipo: fd.tipo, cupo: parseMoney(fd.cupo), cuota: parseMoney(fd.cuota), dia, tasa: fd.tasa ? Number(fd.tasa) : 0 };
    const nuevo = parseMoney(fd.saldo);
    if (isNew) E.deudas.push({ id: uid(), inicial: nuevo, ...vals });
    else Object.assign(d, vals, { inicial: (d.inicial || 0) + (nuevo - actual) });
    saveEstado(); toast("Deuda guardada");
  });
}

function dlgFijo(f) {
  const isNew = !f; f = f || { nombre: "", monto: 0, dia: "", categoria: "Vivienda y servicios" };
  openDlg(`<h2>${isNew ? "Nuevo pago fijo" : esc(f.nombre)}</h2>
    ${fld("¿Qué pagas?", inText("nombre", f.nombre, 'required placeholder="Ej: Arriendo, plan del celular, semestre"'))}
    <div class="fields2">${fld("Valor", inMoney("monto", f.monto, "required"))}${fld("Día del mes", `<input type="number" name="dia" id="f-dia" min="1" max="31" inputmode="numeric" required value="${f.dia || ""}">`)}</div>
    ${fld("Categoría", sel("categoria", CATS_GASTO.map(c => [c, c]), f.categoria))}
    ${btns(isNew ? "" : "Eliminar pago")}`, fd => {
    if (fd === "delete") { E.fijos = E.fijos.filter(x => x.id !== f.id); saveEstado(); toast("Pago eliminado"); return; }
    if (!fd.nombre.trim()) return "Escribe qué pagas.";
    const monto = parseMoney(fd.monto); if (!monto) return "Escribe el valor.";
    const dia = Math.min(31, Math.max(1, parseInt(fd.dia, 10) || 1));
    const vals = { nombre: fd.nombre.trim(), monto, dia, categoria: fd.categoria };
    if (isNew) E.fijos.push({ id: uid(), ...vals }); else Object.assign(f, vals);
    saveEstado(); toast("Pago guardado");
  });
}

function dlgApartado(a) {
  const isNew = !a; a = a || { nombre: "", monto: 0, meta: 0, cuentaId: E.cuentas[0]?.id };
  openDlg(`<h2>${isNew ? "Nuevo apartado" : esc(a.nombre)}</h2>
    ${fld("¿Para qué es?", inText("nombre", a.nombre, 'required placeholder="Ej: Fondo de emergencia, semestre, viaje"'))}
    <div class="fields2">${fld("Guardado hoy", inMoney("monto", a.monto))}${fld("Meta (opcional)", inMoney("meta", a.meta))}</div>
    ${fld("¿En qué cuenta está?", sel("cuentaId", E.cuentas.map(c => [c.id, c.nombre]), a.cuentaId))}
    ${btns(isNew ? "" : "Eliminar apartado")}`, fd => {
    if (fd === "delete") { E.apartados = E.apartados.filter(x => x.id !== a.id); saveEstado(); toast("Apartado eliminado"); return; }
    if (!fd.nombre.trim()) return "Ponle un nombre.";
    const vals = { nombre: fd.nombre.trim(), monto: parseMoney(fd.monto), meta: parseMoney(fd.meta), cuentaId: fd.cuentaId };
    if (isNew) E.apartados.push({ id: uid(), ...vals }); else Object.assign(a, vals);
    saveEstado(); toast("Apartado guardado");
  });
}

function dlgApartar(a, s) {
  openDlg(`<h2>${s > 0 ? "Guardar más en" : "Sacar de"} ${esc(a.nombre)}</h2>
    <p class="small muted" style="margin:0">${s > 0 ? "La plata sigue en tu cuenta, pero queda marcada como intocable." : "Esta plata vuelve a quedar disponible para gastar."}</p>
    ${fld("Valor", inMoney("monto", 0, "required autofocus"))}
    ${btns("")}`, fd => {
    const v = parseMoney(fd.monto); if (!v) return "Escribe el valor.";
    if (s < 0 && v > (a.monto || 0)) return `Solo tienes ${money(a.monto)} en este apartado.`;
    a.monto = (a.monto || 0) + s * v; saveEstado(); toast(s > 0 ? "Guardado" : "Listo, quedó disponible");
  });
}

function dlgConfig() {
  openDlg(`<h2>Mi ingreso y mi meta de ahorro</h2>
    ${fld("¿Cuánto recibes al mes en total? (sueldo + otros)", inMoney("ing", E.config.ingresoMensual, "autofocus"))}
    ${fld("¿Cuánto quieres ahorrar cada mes?", inMoney("ahorro", E.config.ahorroMensual))}
    <p class="small muted" style="margin:0">Si dejas el ingreso vacío, uso lo que registraste como ingreso el mes pasado.</p>
    ${btns("")}`, fd => {
    E.config.ingresoMensual = parseMoney(fd.ing); E.config.ahorroMensual = parseMoney(fd.ahorro); saveEstado(); toast("Guardado");
  });
}

/* ---------- acciones ---------- */
document.addEventListener("click", async e => {
  const tb = e.target.closest("nav.tabs button, [data-tab-go]");
  if (tb) { tab = tb.dataset.tab || tb.dataset.tabGo; try { localStorage.setItem("finanzas-tab", tab); } catch (x) {} render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.closest("dialog")) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === "start") { E = blankEstado(); saveEstado(); render(); dlgCuenta(E.cuentas[0]); return; }
  if (!E) return;
  if (act === "mov") { if (!E.cuentas.length) { toast("Primero crea una cuenta."); return; } dlgMov(b.dataset.tipo, null, b.dataset.deuda ? { hacia: "d:" + b.dataset.deuda, monto: E.deudas.find(d => d.id === b.dataset.deuda)?.cuota } : {}); }
  if (act === "edit-mov") { const m = allMovs().find(x => x.id === id); if (m) dlgMov(null, m); }
  if (act === "new-cuenta") dlgCuenta(null);
  if (act === "edit-cuenta") dlgCuenta(E.cuentas.find(c => c.id === id));
  if (act === "new-deuda") dlgDeuda(null);
  if (act === "edit-deuda") dlgDeuda(E.deudas.find(c => c.id === id));
  if (act === "new-fijo") dlgFijo(null);
  if (act === "edit-fijo") dlgFijo(E.fijos.find(c => c.id === id));
  if (act === "new-apartado") { if (!E.cuentas.length) { toast("Primero crea una cuenta."); return; } dlgApartado(null); }
  if (act === "edit-apartado") dlgApartado(E.apartados.find(c => c.id === id));
  if (act === "apartar") dlgApartar(E.apartados.find(c => c.id === id), Number(b.dataset.s));
  if (act === "config") dlgConfig();
  if (act === "month") { const [y, m] = viewMonth.split("-").map(Number); const d = new Date(y, m - 1 + Number(b.dataset.d), 1); viewMonth = isoDate(d).slice(0, 7); render(); }
  if (act === "pagar") {
    const o = obligaciones().find(x => x.key === b.dataset.key); if (!o) return;
    if (!E.cuentas.length) { toast("Primero crea una cuenta."); return; }
    if (o.kind === "cuota") dlgMov("abono", null, { hacia: "d:" + o.obj.id, monto: o.monto, ref: o.key, nota: "Cuota " + o.obj.nombre });
    else dlgMov("gasto", null, { monto: o.monto, categoria: o.obj.categoria, nota: o.nombre, ref: o.key });
  }
  if (act === "export") exportar();
});

async function exportar() {
  const rows = [["Fecha", "Tipo", "Valor", "Sale de", "Llega a", "Categoría", "Nota"]];
  for (const m of allMovs().sort((a, b) => a.fecha.localeCompare(b.fecha))) rows.push([m.fecha, tipoMov(m), m.monto, nombreRef(m.desde), nombreRef(m.hacia), m.categoria, m.nota]);
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  try {
    const dl = window.claude && await window.claude.use("downloads");
    if (!dl) {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `mis-movimientos-${isoDate(today())}.csv`;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Copia descargada"); return;
    }
    await dl.save({ filename: `mis-movimientos-${isoDate(today())}.csv`, data: csv });
  } catch (e) { if (!e || e.code !== "declined") toast("No se pudo descargar la copia."); }
}

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

try { const t = localStorage.getItem("finanzas-tab"); if (t) tab = t; } catch (e) {}
document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
boot();
})();
</script>

<script>
/* app instalable: modo sin conexión + botón Instalar */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
(function(){
  let deferred = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; document.querySelectorAll("[data-install]").forEach(b => b.hidden = false); });
  addEventListener("appinstalled", () => document.querySelectorAll("[data-install]").forEach(b => b.hidden = true));
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-install]"); if (!b || !deferred) return;
    deferred.prompt(); try { await deferred.userChoice; } catch(x){} deferred = null; b.hidden = true;
  });
})();
</script>
