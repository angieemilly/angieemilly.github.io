:root[data-theme="dark"]{

const fechaLarga = s => { const [y, m, d] = s.split("-").map(Number); return `${d} de ${MESES[m - 1]}${y !== new Date().getFullYear() ? " " + y : ""}`; };
const LS = "quincenas-v1";

function seed() {
  const D = [
    ["nequi", "Crédito Nequi", 1260000, "$1.000.000 a 9 cuotas de $140.000. Se paga el 5 (1ra: 5 dic)."],
    ["intn", "Intereses Nequi oct", 15000, "Del 22 oct al 5 nov."],
    ["lic", "Addi licencia moto", 895146, "Vence el 28."],
    ["ropa", "Addi ropa", 302857, "5 cuotas, vence el 28."],
    ["zap", "Addi zapatos", 135000, "3 cuotas, vence el 28."],
    ["nu", "Nu adelanto", 150000, "2 cuotas: máximo 10 dic y 10 ene."],
    ["tia", "Tía Yazz", 50000, "$50.000 + el conjunto. Cuando sepas cuánto vale, súmalo aquí."],
    ["mama", "Mamá Novaventa", 30000, ""],
    ["icetex", "Reponer ICETEX (uñas)", 60000, "Plata del ICETEX de diciembre."],
  ].map(([id, n, total, nota]) => ({ id, n, total, nota }));
  const it = (n, m, deuda = "", nota = "") => ({ id: uid(), n, m, deuda, nota, ok: false });
  const aseo = () => it("Aseo mamá", 50000, "", "Gasto fijo");
  const tigo = () => it("Tigo celular", 48000, "", "Vence el 30");
  const nequi = () => it("Crédito Nequi", 140000, "nequi", "Vence el 5 del otro mes");
  const lic = (m = 140000) => it("Addi licencia moto", m, "lic", "Vence el 28");
  const ropa = (m = 60572) => it("Addi ropa", m, "ropa", "Vence el 28");
  const zap = () => it("Addi zapatos", 45000, "zap", "Vence el 28");
  const tia = () => it("Abono tía Yazz", 50000, "tia", "Puede ser 30 o 50");
  const Q = [
    ["2026-10-30", [it("Pasajes noviembre", 100000, "", "Solo este mes"), it("Intereses Nequi", 15000, "intn"), it("Reponer ICETEX (uñas)", 60000, "icetex"), it("Retiro fin de semana", 150000, "", "30-31 oct y 1 nov"), it("Mamá Novaventa", 30000, "mama")]],
    ["2026-11-15", [aseo(), it("Pasajes noviembre", 100000), lic(), ropa(), zap()]],
    ["2026-11-30", [tigo(), nequi(), it("Nu adelanto", 75000, "nu", "1ra cuota, vence 10 dic"), tia()]],
    ["2026-12-15", [aseo(), lic(), ropa(), zap()]],
    ["2026-12-30", [tigo(), nequi(), it("Nu adelanto", 75000, "nu", "2da cuota, vence 10 ene"), tia()]],
    ["2027-01-15", [aseo(), lic(), ropa(), zap()]],
    ["2027-01-30", [tigo(), nequi(), tia()]],
    ["2027-02-15", [aseo(), lic(), ropa()]],
    ["2027-02-28", [tigo(), nequi(), tia()]],
    ["2027-03-15", [aseo(), lic(), ropa(60569)]],
    ["2027-03-30", [tigo(), nequi(), tia()]],
    ["2027-04-15", [aseo(), lic()]],
    ["2027-04-30", [tigo(), nequi()]],
    ["2027-05-15", [aseo(), lic(55146)]],
    ["2027-05-30", [tigo(), nequi()]],
    ["2027-06-15", [aseo()]],
    ["2027-06-30", [tigo(), nequi()]],
    ["2027-07-15", [aseo()]],
    ["2027-07-30", [tigo(), nequi()]],
  ].map(([fecha, items]) => ({ id: uid(), fecha, items }));
  return { ingreso: 400000, deudas: D, quincenas: Q };
}

let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
if (!S || !Array.isArray(S.quincenas)) S = seed();
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast("No se pudo guardar en este celular."); } };
save();

let tab = "quincenas";
try { tab = localStorage.getItem("quincenas-tab") || tab; } catch (e) {}

const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const qTotal = q => sum(q.items, i => i.m);
const qPaid = q => sum(q.items, i => i.ok ? i.m : 0);
const qDone = q => q.items.length > 0 && q.items.every(i => i.ok);
const sorted = () => [...S.quincenas].sort((a, b) => a.fecha.localeCompare(b.fecha));
const paidTo = id => sum(S.quincenas, q => sum(q.items, i => i.ok && i.deuda === id ? i.m : 0));
const plannedTo = id => sum(S.quincenas, q => sum(q.items, i => i.deuda === id ? i.m : 0));

/* ---------- vistas ---------- */
function qCard(q, isNext) {
  const tot = qTotal(q), paid = qPaid(q), left = S.ingreso - tot;
  return `<div class="card${isNext ? " next" : ""}" data-q="${q.id}">
    <div class="q-head"><h2>${isNext ? "👉 " : ""}${esc(fechaLarga(q.fecha))}</h2>
      ${qDone(q) ? '<span class="chip good">Todo pagado</span>' : `<span class="chip ${left < 0 ? "bad" : left < 30000 ? "warn" : "neutral"}">Me queda <span class="num">${money(left)}</span></span>`}</div>
    <div class="q-sum"><span>Debo sacar <b class="num">${money(tot)}</b></span><span>Ya pagué <b class="num">${money(paid)}</b></span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${tot ? Math.round(paid / tot * 100) : 0}%"></i></div>
    <div class="list" style="margin-top:4px">${q.items.map(i => `
      <div class="check${i.ok ? " ok" : ""}" data-item="${i.id}">
        <button class="tick" data-toggle aria-pressed="${i.ok}" aria-label="Marcar ${esc(i.n)} como pagado">${TICK}</button>
        <div class="grow" data-edit><div class="title">${esc(i.n)}</div>${i.nota ? `<div class="small muted">${esc(i.nota)}</div>` : ""}</div>
        <div class="num amt" data-edit>${money(i.m)}</div>
      </div>`).join("") || '<div class="empty">Sin pagos en esta quincena.</div>'}</div>
    <div class="add-row"><button class="btn ghost" data-add>+ Agregar pago</button></div>
  </div>`;
}

function vQuincenas() {
  const qs = sorted();
  const nextIdx = qs.findIndex(q => !qDone(q));
  const next = qs[nextIdx];
  const done = qs.slice(0, Math.max(nextIdx, 0)).filter(qDone);
  const rest = nextIdx < 0 ? [] : qs.slice(nextIdx).filter(q => q !== next);
  const hero = next ? `<div class="card hero">
      <div class="label">Próxima quincena · ${esc(fechaLarga(next.fecha))}</div>
      <div class="label" style="margin-top:4px">Debo sacar</div>
      <div class="big">${money(qTotal(next) - qPaid(next))}</div>
      <div class="split"><span>Me pagan ${money(S.ingreso)}</span><span>Me queda libre ${money(S.ingreso - qTotal(next))}</span></div>
    </div>` : `<div class="card hero"><div class="big">¡Todo pagado! 🎉</div></div>`;
  return `${hero}
    ${next ? qCard(next, true) : ""}
    ${rest.map(q => qCard(q, false)).join("")}
    ${done.length ? `<details class="done"><summary>✓ Quincenas ya pagadas (${done.length})</summary><div class="stack">${done.map(q => qCard(q, false)).join("")}</div></details>` : ""}
    <button class="btn" id="addQ">+ Agregar quincena</button>`;
}

function vDeudas() {
  const rows = S.deudas.map(d => ({ d, paid: paidTo(d.id), plan: plannedTo(d.id) }));
  const tot = sum(rows, r => r.d.total), paid = sum(rows, r => Math.min(r.paid, r.d.total));
  return `<div class="card hero"><div class="label">Me falta pagar</div><div class="big">${money(tot - paid)}</div>
      <div class="split"><span>Debo en total ${money(tot)}</span><span>Ya pagué ${money(paid)}</span></div></div>
    <div class="card"><div class="list">${rows.map(({ d, paid, plan }) => {
      const left = Math.max(0, d.total - paid), pct = d.total ? Math.min(100, Math.round(paid / d.total * 100)) : 0;
      const gap = d.total - plan;
      return `<div class="item" data-debt="${d.id}" style="flex-direction:column;align-items:stretch;gap:6px;cursor:pointer">
        <div class="row"><div class="title">${esc(d.n)}</div>${left === 0 ? '<span class="chip good">Pagada ✓</span>' : `<span class="num">${money(left)}</span>`}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="small muted">Ya pagué ${money(paid)} de ${money(d.total)}${gap > 0 ? ` · <span class="neg">faltan ${money(gap)} por poner en alguna quincena</span>` : ""}${d.nota ? " · " + esc(d.nota) : ""}</div>
      </div>`; }).join("")}</div></div>
    <button class="btn" id="addDebt">+ Agregar deuda</button>
    <p class="small muted">Toca una deuda para cambiar el total (por ejemplo, cuando sepas cuánto vale el conjunto de tu tía).</p>`;
}

function vAjustes() {
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h2>Lo que me pagan</h2>
      <div class="field"><label for="ing">Por quincena</label><input id="ing" class="money" inputmode="numeric" value="${fmtInput(S.ingreso)}"></div>
    </div>
    <div class="card tip"><b>Cómo usarlo:</b><ol class="steps">
      <li>Cuando pagues algo, toca el cuadrito y queda tachado.</li>
      <li>Toca el nombre o el valor para cambiarlo, moverle la nota o borrarlo.</li>
      <li>La quincena de arriba siempre es la próxima que tienes pendiente.</li>
      <li>Tus datos quedan en este celular. Descarga la copia de seguridad en Mi agenda → Apariencia.</li></ol></div>
    <button class="btn danger" id="reset">Volver al plan inicial</button>`;
}

const app = $("#app");
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  app.innerHTML = `<section class="view">${tab === "deudas" ? vDeudas() : tab === "ajustes" ? vAjustes() : vQuincenas()}</section>`;
}

/* ---------- editar ---------- */
let cur = null;
const dlg = $("#dlg");
function openItem(qid, iid) {
  const q = S.quincenas.find(x => x.id === qid);
  const i = iid ? q.items.find(x => x.id === iid) : null;
  cur = { q, i };
  $("#dlgT").textContent = i ? "Editar pago" : `Nuevo pago · ${fechaLarga(q.fecha)}`;
  $("#fN").value = i ? i.n : ""; $("#fM").value = i ? fmtInput(i.m) : ""; $("#fNo").value = i ? i.nota : "";
  $("#fD").innerHTML = `<option value="">No, es un gasto</option>` + S.deudas.map(d => `<option value="${d.id}"${i && i.deuda === d.id ? " selected" : ""}>${esc(d.n)}</option>`).join("");
  $("#dlgDel").hidden = !i;
  dlg.showModal();
}
$("#fM").addEventListener("input", e => { e.target.value = fmtInput(e.target.value); });
$("#dlgCancel").onclick = () => dlg.close();
$("#dlgDel").onclick = () => { cur.q.items = cur.q.items.filter(x => x !== cur.i); save(); dlg.close(); render(); toast("Pago borrado."); };
$("#dlgForm").addEventListener("submit", () => {
  const v = { n: $("#fN").value.trim(), m: parseMoney($("#fM").value), deuda: $("#fD").value, nota: $("#fNo").value.trim() };
  if (!v.n) return;
  if (cur.i) Object.assign(cur.i, v); else cur.q.items.push({ id: uid(), ok: false, ...v });
  save(); render();
});

let curDebt = null;
const dlgDebt = $("#dlgDebt");
function openDebt(id) {
  curDebt = id ? S.deudas.find(d => d.id === id) : null;
  $("#debtT").textContent = curDebt ? "Editar deuda" : "Nueva deuda";
  $("#dN").value = curDebt ? curDebt.n : ""; $("#dTot").value = curDebt ? fmtInput(curDebt.total) : ""; $("#dNo").value = curDebt ? curDebt.nota : "";
  $("#debtDel").hidden = !curDebt;
  dlgDebt.showModal();
}
$("#dTot").addEventListener("input", e => { e.target.value = fmtInput(e.target.value); });
$("#debtCancel").onclick = () => dlgDebt.close();
$("#debtDel").onclick = () => {
  S.deudas = S.deudas.filter(d => d !== curDebt);
  S.quincenas.forEach(q => q.items.forEach(i => { if (i.deuda === curDebt.id) i.deuda = ""; }));
  save(); dlgDebt.close(); render();
};
$("#debtForm").addEventListener("submit", () => {
  const v = { n: $("#dN").value.trim(), total: parseMoney($("#dTot").value), nota: $("#dNo").value.trim() };
  if (!v.n) return;
  if (curDebt) Object.assign(curDebt, v); else S.deudas.push({ id: uid(), ...v });
  save(); render();
});

document.addEventListener("click", e => {
  const tb = e.target.closest("nav.tabs button");
  if (tb) { tab = tb.dataset.tab; try { localStorage.setItem("quincenas-tab", tab); } catch (x) {} render(); scrollTo(0, 0); return; }
  const card = e.target.closest("[data-q]");
  if (card) {
    const q = S.quincenas.find(x => x.id === card.dataset.q);
    const row = e.target.closest("[data-item]");
    if (e.target.closest("[data-toggle]") && row) {
      const i = q.items.find(x => x.id === row.dataset.item); i.ok = !i.ok; save();
      if (i.ok && qDone(q)) toast("¡Quincena pagada completa! 💗");
      render(); return;
    }
    if (e.target.closest("[data-edit]") && row) return openItem(q.id, row.dataset.item);
    if (e.target.closest("[data-add]")) return openItem(q.id, null);
  }
  const dr = e.target.closest("[data-debt]"); if (dr) return openDebt(dr.dataset.debt);
  if (e.target.closest("#addDebt")) return openDebt(null);
  if (e.target.closest("#addQ")) {
    const last = sorted().pop(); const d = last ? new Date(last.fecha + "T12:00") : new Date();
    if (d.getDate() <= 15) { d.setDate(28); d.setDate(Math.min(30, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
    else { d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(15); }
    const p = n => String(n).padStart(2, "0");
    S.quincenas.push({ id: uid(), fecha: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`, items: [] });
    save(); render(); toast("Quincena agregada al final."); return;
  }
  if (e.target.closest("#reset")) {
    const b = e.target.closest("#reset");
    if (b.dataset.sure) { S = seed(); save(); tab = "quincenas"; render(); toast("Listo, volviste al plan inicial."); }
    else { b.dataset.sure = "1"; b.textContent = "¿Segura? Se borran tus marcas. Toca otra vez"; }
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "ing") { S.ingreso = parseMoney(e.target.value); save(); toast("Guardado."); }
});
document.addEventListener("input", e => { if (e.target.id === "ing") e.target.value = fmtInput(e.target.value); });

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

$("#hoy").textContent = new Date().toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });
render();
})();
</script>

<script>
/* app instalable: modo sin conexión + botón Instalar (siempre visible, con ayuda según el celular) */
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
(function(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const btns = () => document.querySelectorAll("[data-install]");
  const setVis = v => btns().forEach(b => b.hidden = !v);
  setVis(!standalone);
  let deferred = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; setVis(true); });
  addEventListener("appinstalled", () => setVis(false));
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const android = /Android/i.test(ua);
  const samsung = /SamsungBrowser/i.test(ua);
  const inApp = /; wv\)|FBAN|FBAV|Instagram|Line\/|WhatsApp|Claude/i.test(ua) || (android && !/Chrome\//.test(ua) && !/Firefox/.test(ua));
  const iosSafari = ios && !/CriOS|FxiOS|EdgiOS|FBAN|FBAV|Instagram|Claude/i.test(ua);
  function steps(){
    if (ios && !iosSafari) return ["Estás en un navegador que no puede instalar apps en iPhone.", "Copia el enlace con el botón de abajo.", "Abre <b>Safari</b>, pégalo y entra.", "Toca <b>Instalar app</b> otra vez y sigue los pasos."];
    if (ios) return ["Toca el botón <b>Compartir</b> de Safari (el cuadrito con la flecha hacia arriba ⬆️, abajo en la pantalla).", "Baja en la lista y toca <b>Agregar a inicio</b>.", "Toca <b>Agregar</b>. Listo: el ícono rosado queda en tu pantalla."];
    if (inApp) return ["Abriste el enlace dentro de otra app y desde ahí no se puede instalar.", "Toca los tres puntos ⋮ y elige <b>Abrir en Chrome</b> (o copia el enlace y pégalo en Chrome).", "Ya en Chrome, toca <b>Instalar app</b> otra vez."];
    if (samsung) return ["Toca el menú ☰ abajo a la derecha.", "Toca <b>Agregar página a</b> y luego <b>Pantalla de inicio</b>.", "Toca <b>Agregar</b>."];
    if (android) return ["Toca los tres puntos ⋮ arriba a la derecha de Chrome.", "Toca <b>Instalar aplicación</b> o <b>Agregar a pantalla principal</b>.", "Toca <b>Instalar</b>. Listo: el ícono rosado queda en tu pantalla."];
    return ["En el computador, busca el ícono de instalar (una pantallita con flecha) al final de la barra de direcciones de Chrome o Edge y tócalo.", "Para el celular, abre <b>angieemilly.github.io</b> en Chrome (Android) o Safari (iPhone) y toca <b>Instalar app</b>."];
  }
  function sheet(){
    let s = document.getElementById("installSheet");
    if (!s){
      const st = document.createElement("style");
      st.textContent = "#installSheet{position:fixed;inset:0;background:rgb(10 14 22 / .5);display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50}#installSheet .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px}#installSheet h2{margin:0;font-size:1.2rem}#installSheet ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;line-height:1.45}#installSheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}#installSheet button{font:inherit;font-weight:600;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}#installSheet .pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}";
      document.head.append(st);
      s = document.createElement("div"); s.id = "installSheet"; s.hidden = true;
      s.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-labelledby="instT"><h2 id="instT">Instalar Mi Control</h2><ol id="instSteps"></ol><div class="acts"><button type="button" id="instCopy">Copiar enlace</button><button type="button" class="pri" id="instOk">Entendido</button></div></div>';
      document.body.append(s);
      s.addEventListener("click", e => { if (e.target === s) s.hidden = true; });
      s.querySelector("#instOk").onclick = () => s.hidden = true;
      s.querySelector("#instCopy").onclick = async e => {
        const url = "https://angieemilly.github.io/";
        try { await navigator.clipboard.writeText(url); e.target.textContent = "¡Enlace copiado!"; } catch(x){ e.target.textContent = url; }
      };
    }
    s.querySelector("#instSteps").innerHTML = steps().map(t => "<li>" + t + "</li>").join("");
    s.hidden = false;
  }
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-install]"); if (!b) return;
    if (deferred){ deferred.prompt(); let ok = false; try { ok = (await deferred.userChoice).outcome === "accepted"; } catch(x){} deferred = null; if (ok) setVis(false); return; }
    sheet();
  });
})();
</script>
